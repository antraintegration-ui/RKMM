<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radha Krishna Mitra Mandal - Donation Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-navy: #0e2a47;
      --accent-gold:  #d97706;
      --gold-hover:   #b45309;
      --bg-main:      #f8fafc;
      --card-bg:      #ffffff;
      --text-dark:    #0f172a;
      --text-muted:   #64748b;
      --border-color: #e2e8f0;
      --danger:       #ef4444;
      --danger-bg:    #fef2f2;
      --success:      #10b981;
      --radius-lg:    16px;
      --radius-md:    10px;
      --shadow-card:  0 10px 25px -5px rgba(14,42,71,0.08),
                      0 8px 10px -6px rgba(14,42,71,0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      gap: 16px;
    }
    .brand-group { display: flex; align-items: center; gap: 16px; }

    .brand-logo-wrapper {
      width: 90px; height: 90px; min-width: 90px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #d97706;
      outline: 2px solid rgba(251,191,36,0.35);
      outline-offset: 2px;
      box-shadow: 0 0 0 5px rgba(251,191,36,0.12), 0 8px 24px rgba(217,119,6,0.22);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0; padding: 2px;
    }
    .brand-logo {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: contain; object-position: center; display: block;
    }

    .brand-info h1 {
      font-size: 1.3rem; font-weight: 800;
      color: var(--primary-navy); letter-spacing: -0.01em; line-height: 1.25;
    }
    .brand-info .tagline {
      font-size: 0.82rem; color: var(--accent-gold);
      font-weight: 700; margin-top: 4px;
    }

    .sync-badge {
      display: flex; align-items: center; gap: 6px;
      background: #ecfdf5; color: #047857;
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700;
      border: 1px solid #a7f3d0; white-space: nowrap; flex-shrink: 0;
    }
    .sync-dot {
      width: 8px; height: 8px;
      background-color: var(--success);
      border-radius: 50%; animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(1.2); }
    }

    @media (max-width: 500px) {
      .app-header { flex-direction:column; align-items:center; text-align:center; padding:16px; gap:12px; }
      .brand-group { flex-direction:column; align-items:center; gap:10px; }
      .brand-logo-wrapper { width:100px; height:100px; min-width:100px; }
      .brand-info h1 { font-size:1.15rem; }
    }

    /* ===== TOTAL CARD ===== */
    .total-card {
      background: linear-gradient(135deg,#0e2a47 0%,#173d66 100%);
      color:#fff; padding:24px 28px; border-radius:var(--radius-lg);
      box-shadow:0 16px 25px -10px rgba(14,42,71,0.3);
      border:1px solid rgba(251,191,36,0.3);
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .total-card .tc-left .label {
      font-size:.75rem; text-transform:uppercase; letter-spacing:1.4px;
      color:#fbbf24; font-weight:700; margin-bottom:6px;
    }
    .total-card .tc-left .amount {
      font-size:2.4rem; font-weight:800; letter-spacing:-0.02em; color:#fff;
    }
    .total-card .tc-right {
      font-size:.78rem; color:rgba(255,255,255,0.6); font-weight:600; text-align:right;
    }
    .total-card .tc-right span {
      display:block; font-size:1.3rem; font-weight:800; color:#fbbf24; margin-top:2px;
    }

    /* ===== CARDS ===== */
    .card {
      background:var(--card-bg); border-radius:var(--radius-lg);
      border:1px solid var(--border-color); padding:20px; box-shadow:var(--shadow-card);
    }
    .card-title {
      font-size:1.05rem; font-weight:700; color:var(--primary-navy);
      margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;
    }

    /* ===== FORM ===== */
    .form-grid { display:grid; grid-template-columns:1fr; gap:14px; }
    @media (min-width:600px) {
      .form-grid { grid-template-columns:1fr 1fr; }
      .full-width { grid-column:span 2; }
    }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-group label {
      font-size:.75rem; font-weight:700; color:var(--text-dark);
      text-transform:uppercase; letter-spacing:.5px;
    }
    .form-group input {
      padding:11px 14px; border:1.5px solid var(--border-color);
      border-radius:var(--radius-md); font-size:.95rem; color:var(--text-dark);
      outline:none; transition:border-color .15s, box-shadow .15s;
    }
    .form-group input:focus {
      border-color:var(--accent-gold);
      box-shadow:0 0 0 3px rgba(217,119,6,0.15);
    }
    .button-group { display:flex; gap:10px; }

    .btn {
      padding:12px 18px; border:none; border-radius:var(--radius-md);
      font-size:.95rem; font-weight:700; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      gap:8px; transition:transform .15s, box-shadow .15s;
    }
    .btn-primary {
      background:linear-gradient(135deg,var(--accent-gold),var(--gold-hover));
      color:#fff; flex:1; box-shadow:0 4px 12px rgba(217,119,6,0.25);
    }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(217,119,6,0.35); }
    .btn-cancel { background:#e2e8f0; color:var(--text-dark); display:none; }

    .btn-action {
      padding:6px 11px; font-size:.78rem; border-radius:6px;
      font-weight:700; border:none; cursor:pointer; transition:all .15s;
    }
    .btn-edit   { background:#eff6ff; color:#2563eb; margin-right:4px; }
    .btn-edit:hover   { background:#2563eb; color:#fff; }
    .btn-delete { background:var(--danger-bg); color:var(--danger); }
    .btn-delete:hover { background:var(--danger); color:#fff; }

    /* ===== SEARCH ===== */
    .search-wrapper { position:relative; margin-bottom:16px; }
    .search-wrapper input {
      width:100%; padding:11px 14px 11px 42px;
      border:1.5px solid var(--border-color); border-radius:var(--radius-md);
      font-size:.95rem; outline:none; background:#f8fafc; transition:all .15s;
    }
    .search-wrapper input:focus {
      background:#fff; border-color:var(--accent-gold);
      box-shadow:0 0 0 3px rgba(217,119,6,0.12);
    }
    .search-icon {
      position:absolute; left:14px; top:50%;
      transform:translateY(-50%); color:#94a3b8; pointer-events:none;
    }

    /* ===== TABLE ===== */
    .table-responsive {
      width:100%; overflow-x:auto;
      border-radius:var(--radius-md); border:1px solid var(--border-color);
    }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:.88rem; background:#fff; }
    th {
      background:#f8fafc; color:var(--text-muted); font-weight:700;
      text-transform:uppercase; font-size:.72rem; letter-spacing:.5px;
      padding:12px 14px; border-bottom:1px solid var(--border-color);
    }
    td { padding:12px 14px; border-bottom:1px solid var(--border-color); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#f8fafc; }
    .amount-cell { font-weight:800; color:#059669; }
    .badge-area {
      display:inline-block; padding:3px 9px; background:#f1f5f9;
      color:#334155; border-radius:6px; font-weight:600; font-size:.78rem;
    }
    .sr-num {
      width:32px; height:32px; border-radius:50%;
      background:linear-gradient(135deg,var(--primary-navy),#1e4a7a);
      color:#fff; font-size:.72rem; font-weight:800;
      display:inline-flex; align-items:center; justify-content:center;
    }

    /* ===== OPTIMISTIC ROW (saving state) ===== */
    tr.saving td { opacity: .55; }
    tr.saving td:first-child::after {
      content: ' ⏳';
      font-size: .7rem;
    }

    /* ===== NOTIFICATION ===== */
    .notification {
      position:fixed; bottom:24px; left:50%;
      transform:translateX(-50%) translateY(100px);
      padding:12px 24px; border-radius:30px; background:#0f172a;
      color:#fff; font-size:.88rem; font-weight:600;
      box-shadow:0 10px 25px rgba(0,0,0,0.2); z-index:1000;
      opacity:0; transition:all .25s ease; white-space:nowrap;
    }
    .notification.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .notification.success { background:#059669; }
    .notification.error   { background:var(--danger); }

    /* ===== SPINNER ===== */
    .spinner {
      border:2px solid rgba(255,255,255,0.3); border-top:2px solid #fff;
      border-radius:50%; width:16px; height:16px;
      animation:spin .7s linear infinite; flex-shrink:0;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .text-center { text-align:center; }
    .empty-msg { padding:32px; color:var(--text-muted); text-align:center; font-size:.9rem; }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="app-header">
    <div class="brand-group">
      <div class="brand-logo-wrapper">
        <img src="logo.png" alt="Logo" class="brand-logo"
             onerror="this.style.display='none'">
      </div>
      <div class="brand-info">
        <h1>Radha Krishna Mitra Mandal</h1>
        <p class="tagline">सेवा &nbsp;•&nbsp; सहयोग &nbsp;•&nbsp; सद्भाव</p>
      </div>
    </div>
    <div class="sync-badge">
      <div class="sync-dot"></div>
      <span id="syncLabel">Live Sync</span>
    </div>
  </div>

  <!-- TOTAL -->
  <div class="total-card">
    <div class="tc-left">
      <div class="label">Total Donation Collected</div>
      <div class="amount" id="totalAmountDisplay">₹ 0</div>
    </div>
    <div class="tc-right">
      Total Records
      <span id="totalRecordsDisplay">0</span>
    </div>
  </div>

  <!-- FORM -->
  <div class="card">
    <div class="card-title">
      <span id="formTitle">➕ Add New Donation Entry</span>
    </div>
    <formid="chandaForm">
      <input type="hidden" id="editRecordId" value="">
      <div class="form-grid">

        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) *</label>
          <input type="number" id="amount" required min="1" placeholder="Enter donation amount">
        </div>

        <div class="form-group">
          <label for="area">Area / Location *</label>
          <input type="text" id="area" required placeholder="Enter area or location">
        </div>

        <div class="form-group">
          <label for="remark">Remark / Payment Mode</label>
          <input type="text" id="remark" placeholder="e.g. Cash / Online / UPI">
        </div>

        <div class="full-width button-group" style="margin-top:4px;">
          <button type="button" class="btn btn-cancel" id="cancelBtn" onclick="resetFormState()">
            ✕ Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span id="submitBtnText">Add Donation</span>
          </button>
        </div>

      </div>
    </form>
  </div>

  <!-- REGISTER LIST -->
  <div class="card">
    <div class="card-title">📋 Donation Register List</div>

    <div class="search-wrapper">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput"
             placeholder="Search by name, amount, area, remark...">
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Amount</th>
            <th>Area</th>
            <th>Remark</th>
            <th style="text-align:right;">Action</th>
          </tr>
        </thead>
        <tbody id="recordsTableBody">
          <tr>
            <td colspan="6" class="text-center">
              Loading records...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- end .container -->

<div id="notification" class="notification"></div>

<script>
  // =============================================
  // ✅ APNA URL YAHAN DAALO
  // =============================================
  const API_URL = "https://script.google.com/macros/s/AKfycbzwYqpSCPwVk-s2CeT9LjY7-_2nmCta92u5iZZ7l1bWYJnnzgv3XZ_TiezXf0S6j7IkzA/exec";

  // =============================================
  // STATE
  // =============================================
  let allRecords  = [];
  let isSyncing   = false;

  // =============================================
  // DOM REFS
  // =============================================
  const chandaForm          = document.getElementById('chandaForm');
  const submitBtn           = document.getElementById('submitBtn');
  const cancelBtn           = document.getElementById('cancelBtn');
  const formTitle           = document.getElementById('formTitle');
  const editRecordId        = document.getElementById('editRecordId');
  const searchInput         = document.getElementById('searchInput');
  const recordsTableBody    = document.getElementById('recordsTableBody');
  const totalAmountDisplay  = document.getElementById('totalAmountDisplay');
  const totalRecordsDisplay = document.getElementById('totalRecordsDisplay');
  const notification        = document.getElementById('notification');
  const syncLabel           = document.getElementById('syncLabel');

  // =============================================
  // INIT
  // =============================================
  document.addEventListener('DOMContentLoaded', fetchRecords);
  chandaForm.addEventListener('submit', handleFormSubmit);

  // ✅ SEARCH FIX — input event + keyup dono
  searchInput.addEventListener('input',  handleSearch);
  searchInput.addEventListener('keyup',  handleSearch);
  searchInput.addEventListener('change', handleSearch);

  // =============================================
  // FETCH
  // =============================================
  async function fetchRecords(showLoader = true) {
    try {
      if (showLoader === true) renderTableLoading();

      const res    = await fetch(API_URL, { redirect: 'follow' });
      const text   = await res.text();
      const result = JSON.parse(text);

      if (result.status === 'success') {
        allRecords = result.data || [];
        // ✅ Fetch ke baad bhi search preserve karo
        renderFiltered();
      } else {
        showEmptyTable('❌ Data load nahi hua.');
        showNotification(result.message || 'Fetch error.', 'error');
      }
    } catch (err) {
      console.error('fetchRecords:', err);
      showEmptyTable('⚠️ Connection failed. Refresh karo.');
      showNotification('Network error. Refresh karo.', 'error');
    }
  }

  // =============================================
  // FORM SUBMIT — OPTIMISTIC ADD / EDIT
  // =============================================
  async function handleFormSubmit(e) {
    e.preventDefault();

    const id     = editRecordId.value.trim();
    const name   = document.getElementById('name').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const area   = document.getElementById('area').value.trim();
    const remark = document.getElementById('remark').value.trim();

    if (!name || isNaN(amount) || amount <= 0 || !area) {
      showNotification('Sahi se fields bharo!', 'error');
      return;
    }

    const isEdit = Boolean(id);

    // OPTIMISTIC UPDATE
    if (isEdit) {
      const idx = allRecords.findIndex(r => String(r.id) === id);
      if (idx !== -1) {
        allRecords[idx] = {
          ...allRecords[idx], name, amount, area, remark
        };
      }
      showNotification('✅ Entry update ho gayi!', 'success');
    } else {
      const tempId = 'TEMP_' + Date.now();
      allRecords.push({
        id        : tempId,
        name, amount, area, remark,
        timestamp : 'Saving...'
      });
      showNotification('✅ Entry add ho gayi!', 'success');
    }

    renderFiltered();
    resetFormState();

    // Background API call
    const payload = {
      action: isEdit ? 'edit' : 'add',
      name, amount, area, remark
    };
    if (isEdit) payload.id = id;

    setSyncBadge(true);

    try {
      const res    = await fetch(API_URL, {
        method  : 'POST',
        redirect: 'follow',
        body    : JSON.stringify(payload)
      });
      const text   = await res.text();
      const result = JSON.parse(text);

      if (result.status === 'success') {
        if (!isEdit && result.id) {
          const tempIdx = allRecords.findIndex(
            r => String(r.id).startsWith('TEMP_')
          );
          if (tempIdx !== -1) {
            allRecords[tempIdx].id        = result.id;
            allRecords[tempIdx].timestamp =
              new Date().toLocaleString('en-IN');
          }
        }
        silentRefresh();
      } else {
        showNotification(
          '⚠️ Save failed: ' + (result.message || 'Error'), 'error'
        );
        fetchRecords(false);
      }
    } catch (err) {
      console.error('Submit error:', err);
      showNotification('⚠️ Sync nahi hua. Refresh karo.', 'error');
      fetchRecords(false);
    } finally {
      setSyncBadge(false);
    }
  }

  // =============================================
  // DELETE — OPTIMISTIC
  // =============================================
  async function deleteRecord(id) {
    if (!confirm('Sure ho? Permanently delete ho jayega!')) return;

    allRecords = allRecords.filter(r => String(r.id) !== String(id));
    renderFiltered();
    showNotification('✅ Entry delete ho gayi!', 'success');
    if (editRecordId.value === String(id)) resetFormState();

    setSyncBadge(true);

    try {
      const res    = await fetch(API_URL, {
        method  : 'POST',
        redirect: 'follow',
        body    : JSON.stringify({ action: 'delete', id })
      });
      const text   = await res.text();
      const result = JSON.parse(text);

      if (result.status !== 'success') {
        showNotification('⚠️ Delete sync failed.', 'error');
        fetchRecords(false);
      } else {
        silentRefresh();
      }
    } catch (err) {
      console.error('Delete error:', err);
      showNotification('⚠️ Network error.', 'error');
      fetchRecords(false);
    } finally {
      setSyncBadge(false);
    }
  }

  // =============================================
  // SILENT REFRESH
  // =============================================
  async function silentRefresh() {
    try {
      const res    = await fetch(API_URL, { redirect: 'follow' });
      const text   = await res.text();
      const result = JSON.parse(text);
      if (result.status === 'success') {
        allRecords = result.data || [];
        renderFiltered();
      }
    } catch (err) {
      console.warn('silentRefresh failed:', err);
    }
  }

  // =============================================
  // EDIT MODE
  // =============================================
  function startEditRecord(id) {
    const record = allRecords.find(r => String(r.id) === String(id));
    if (!record) return;

    editRecordId.value = record.id;
    document.getElementById('name').value   = record.name;
    document.getElementById('amount').value = record.amount;
    document.getElementById('area').value   = record.area;
    document.getElementById('remark').value = record.remark || '';

    formTitle.textContent = '✏️ Edit / Update Entry';
    document.getElementById('submitBtnText').textContent = 'Update Entry';
    cancelBtn.style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // =============================================
  // RESET FORM
  // =============================================
  function resetFormState() {
    chandaForm.reset();
    editRecordId.value      = '';
    formTitle.textContent   = '➕ Add New Donation Entry';
    submitBtn.disabled      = false;
    submitBtn.innerHTML     = '<span id="submitBtnText">Add Donation</span>';
    cancelBtn.style.display = 'none';
  }

  // =============================================
  // ✅ SEARCH HANDLER — FIXED
  // =============================================
  function handleSearch() {
    renderFiltered();
  }

  // =============================================
  // ✅ renderFiltered — Search + Render ek saath
  // =============================================
  function renderFiltered() {
    const q = searchInput.value.toLowerCase().trim();

    // ✅ Agar search empty hai toh sab dikhao
    const filtered = (q === '')
      ? allRecords
      : allRecords.filter(r => {
          const nameMatch   = r.name.toLowerCase().includes(q);
          const amountMatch = String(r.amount).includes(q);
          const areaMatch   = r.area.toLowerCase().includes(q);
          const remarkMatch = r.remark
            ? r.remark.toLowerCase().includes(q)
            : false;
          return nameMatch || amountMatch || areaMatch || remarkMatch;
        });

    // ✅ Total hamesha allRecords se (search se affect na ho)
    const total = allRecords.reduce(
      (s, r) => s + (Number(r.amount) || 0), 0
    );
    totalAmountDisplay.textContent  = `₹ ${total.toLocaleString('en-IN')}`;
    totalRecordsDisplay.textContent = allRecords.length;

    // Empty check
    if (filtered.length === 0) {
      showEmptyTable(
        q
          ? `🔍 "${escapeHtml(q)}" ke liye koi record nahi mila.`
          : 'Koi record nahi hai. Pehli entry add karo!'
      );
      return;
    }

    // ✅ DocumentFragment — fast DOM render
    const frag     = document.createDocumentFragment();
    const reversed = filtered.slice().reverse();

    reversed.forEach((record, index) => {
      const tr       = document.createElement('tr');
      const isSaving = String(record.id).startsWith('TEMP_');
      if (isSaving) tr.classList.add('saving');

      // ✅ Search highlight
      const displayName   = q ? highlight(escapeHtml(record.name), q)   : escapeHtml(record.name);
      const displayArea   = q ? highlight(escapeHtml(record.area), q)   : escapeHtml(record.area);
      const displayRemark = q ? highlight(escapeHtml(record.remark || '—'), q) : escapeHtml(record.remark || '—');

      tr.innerHTML = `
        <td><div class="sr-num">${reversed.length - index}</div></td>
        <td>
          <strong style="color:var(--primary-navy);">
            ${displayName}
          </strong>
        </td>
        <td class="amount-cell">
          ₹ ${Number(record.amount).toLocaleString('en-IN')}
        </td>
        <td>
          <span class="badge-area">${displayArea}</span>
        </td>
        <td style="color:var(--text-muted);">
          ${displayRemark}
        </td>
        <td style="text-align:right; white-space:nowrap;">
          ${isSaving
            ? '<span style="font-size:.75rem;color:var(--text-muted);">⏳ Saving…</span>'
            : `<button class="btn-action btn-edit"
                 onclick="startEditRecord('${record.id}')">✏️ Edit</button>
               <button class="btn-action btn-delete"
                 onclick="deleteRecord('${record.id}')">🗑️ Delete</button>`
          }
        </td>`;
      frag.appendChild(tr);
    });

    recordsTableBody.innerHTML = '';
    recordsTableBody.appendChild(frag);
  }

  // =============================================
  // ✅ HIGHLIGHT — Search word yellow highlight
  // =============================================
  function highlight(text, query) {
    if (!query) return text;
    try {
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex   = new RegExp(`(${escaped})`, 'gi');
      return text.replace(
        regex,
        '<mark style="background:#fef08a;color:#0f172a;border-radius:3px;padding:0 2px;">$1</mark>'
      );
    } catch (e) {
      return text;
    }
  }

  // =============================================
  // SYNC BADGE
  // =============================================
  function setSyncBadge(syncing) {
    isSyncing             = syncing;
    syncLabel.textContent = syncing ? 'Syncing…' : 'Live Sync';
  }

  // =============================================
  // UI HELPERS
  // =============================================
  function renderTableLoading() {
    recordsTableBody.innerHTML = `
      <tr>
        <td colspan="6" class="text-center" style="padding:36px;">
          <div class="spinner" style="
            width:30px; height:30px;
            border-color:#e2e8f0;
            border-top-color:var(--accent-gold);
            margin:0 auto 12px;
          "></div>
          <div style="color:var(--text-muted);font-size:.85rem;">
            Loading records…
          </div>
        </td>
      </tr>`;
  }

  function showEmptyTable(msg = 'No records found.') {
    recordsTableBody.innerHTML =
      `<tr><td colspan="6" class="empty-msg">${msg}</td></tr>`;
  }

  let _notifTimer;
  function showNotification(msg, type = 'success') {
    clearTimeout(_notifTimer);
    notification.textContent = msg;
    notification.className   = `notification show ${type}`;
    _notifTimer = setTimeout(() => {
      notification.className = 'notification';
    }, 3000);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&' : '&amp;',
      '<' : '&lt;',
      '>' : '&gt;',
      '"' : '&quot;',
      "'" : '&#39;'
    })[m]);
  }
</script>
</body>
</html>
